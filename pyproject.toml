[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan-rul"
version = "1.0.0"
description = "Remaining useful life prediction for NASA C-MAPSS turbofan engines, with an explainable API"
authors = [{ name = "Zainab Sohail" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
